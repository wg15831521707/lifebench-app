# LifeBench 安卓工程 —— 云端编译 Debug APK 并发布为 Release
# 触发：推送到 main/master 分支，或手动 workflow_dispatch
name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# 发布 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件并接受许可
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: 生成 Gradle Wrapper（仓库未带 gradle-wrapper.jar）
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.6-bin.zip
          unzip -q gradle.zip
          ./gradle-8.6/bin/gradle wrapper --gradle-version 8.6
          chmod +x gradlew

      - name: 编译 Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 发布 APK 到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lifebench-debug-${{ github.run_number }}
          name: "LifeBench v1.0.0 #${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
