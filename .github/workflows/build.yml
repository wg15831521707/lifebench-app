# LifeBench 安卓工程 —— 云端编译 Debug APK
# 触发：推送到 main/master 分支（自动构建并上传产物）；或手动 workflow_dispatch（仅重新构建，不自动发版，发版由脚本处理）
name: Build LifeBench Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# 手动触发发布 Release 时需要写权限；普通推送仅用到 checkout / 上传产物（read 也够，统一写避免权限报错）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装并配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受许可并安装 SDK 组件
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: 缓存 Gradle 二进制与依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle-home/gradle-8.6
            ~/.gradle/caches
          key: gradle-8.6-deps-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-8.6-deps-

      - name: 准备 Gradle 8.6（仓库未提交 wrapper jar，直接调用 gradle 二进制）
        run: |
          if [ ! -x ~/.gradle-home/gradle-8.6/bin/gradle ]; then
            mkdir -p ~/.gradle-home
            curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.6-bin.zip \
              || curl -L -o gradle.zip https://mirrors.cloud.tencent.com/gradle/gradle-8.6-bin.zip
            unzip -q gradle.zip -d ~/.gradle-home
          fi

      - name: 准备稳定签名密钥（从 Secret 解码，覆盖安装保留数据）
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > app/lifebench-release.keystore
          echo "storeFile=lifebench-release.keystore" > app/keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> app/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> app/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> app/keystore.properties
          echo "storeType=PKCS12" >> app/keystore.properties
          keytool -list -keystore app/lifebench-release.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -storetype PKCS12 >/dev/null 2>&1 && echo "KEYSTORE OK" || echo "KEYSTORE FAIL"
        shell: bash

      - name: 编译 Debug APK
        run: |
          set -eo pipefail
          ~/.gradle-home/gradle-8.6/bin/gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: lifebench-debug-apk
          path: app/build/outputs/apk/debug/*.apk
