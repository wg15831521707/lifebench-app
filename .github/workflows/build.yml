# LifeBench 安卓工程 —— 云端编译 Debug APK
# 触发：推送到 main/master 分支（自动构建并上传产物）；或手动 workflow_dispatch（额外发布一个 GitHub Release）
name: Build LifeBench Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# 手动触发发布 Release 时需要写权限；普通推送仅用到 checkout / 上传产物（read 也够，统一写避免权限报错）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装并配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受许可并安装 SDK 组件
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: 缓存 Gradle 二进制与依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle-home/gradle-8.6
            ~/.gradle/caches
          key: gradle-8.6-deps-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-8.6-deps-

      - name: 准备 Gradle 8.6（仓库未提交 wrapper jar，直接调用 gradle 二进制）
        run: |
          if [ ! -x ~/.gradle-home/gradle-8.6/bin/gradle ]; then
            curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.6-bin.zip
            mkdir -p ~/.gradle-home
            unzip -q gradle.zip -d ~/.gradle-home
          fi

      - name: 准备稳定签名密钥（从 Secret 解码，覆盖安装保留数据）
        if: ${{ secrets.SIGNING_KEY != '' }}
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > app/lifebench-release.keystore
          printf 'storeFile=lifebench-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\nstoreType=PKCS12\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > app/keystore.properties
          echo "--- keystore verify ---"
          keytool -list -keystore app/lifebench-release.keystore -storepass "$KEYSTORE_PASSWORD" -storetype PKCS12 >/dev/null 2>&1 && echo "KEYSTORE OK" || echo "KEYSTORE FAIL"
        shell: bash

      - name: 编译 Debug APK
        run: ~/.gradle-home/gradle-8.6/bin/gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: 上报构建错误（诊断通道，看完即删）
        if: failure()
        env:
          GH: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          diag = []
          # 1) keystore 步骤产物状态
          import os.path as P
          diag.append("=== keystore step state ===")
          diag.append("app/keystore.properties exists: " + str(P.exists("app/keystore.properties")))
          diag.append("app/lifebench-release.keystore exists: " + str(P.exists("app/lifebench-release.keystore")))
          if P.exists("app/lifebench-release.keystore"):
              diag.append("keystore size: " + str(P.getsize("app/lifebench-release.keystore")))
          # 2) keytool 校验
          import subprocess
          if P.exists("app/lifebench-release.keystore"):
              pw = os.environ.get("KEYSTORE_PASSWORD","")
              r = subprocess.run(["keytool","-list","-keystore","app/lifebench-release.keystore",
                                  "-storepass",pw,"-storetype","PKCS12"],
                                 capture_output=True, text=True)
              diag.append("keytool rc=" + str(r.returncode))
              diag.append((r.stdout or r.stderr)[-300:])
          # 3) build 错误尾部
          try:
              log = open("build.log", encoding="utf-8", errors="replace").read()
          except Exception as e:
              log = "no build.log: " + str(e)
          diag.append("=== build.log tail ===")
          diag.append(log[-3500:])
          body = "## CI build failed (diag)\n\n```\n" + "\n".join(diag) + "\n```"
          data = json.dumps({"body": body}).encode("utf-8")
          req = urllib.request.Request(
              "https://api.github.com/repos/wg15831521707/lifebench-app/commits/" + os.environ["SHA"] + "/comments",
              data=data, method="POST",
              headers={"Authorization": "token " + os.environ["GH"], "Content-Type": "application/json"})
          try:
              rr = urllib.request.urlopen(req, timeout=30)
              print("comment posted", rr.status)
          except Exception as e:
              print("comment err", e)
          PY

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: lifebench-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: 发布 Release（仅手动触发）
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lifebench-v1.0.0-build-${{ github.run_number }}
          name: "LifeBench v1.0.0 #${{ github.run_number }}"
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
